<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麻雀スコア帳</title>
<meta name="description" content="友達との麻雀の半荘スコア・チップ・役満を記録して、通算成績とランキングを出すスコア帳">
<meta name="theme-color" content="#17694a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="麻雀スコア帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* base */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.brand .auth{margin-left:auto}
.brand .auth .btn{white-space:nowrap}
textarea.in{resize:vertical;font-family:var(--num);font-size:14px;line-height:1.4}
/* layout: one narrow score-sheet column; tabs up top, wide tables scroll sideways on phones */
:root{
  --bg:#eef1ec; --surface:#fbfcf8; --surface-2:#e2e8df; --line:#cbd4c9; --fg:#17201a; --muted:#56635a;
  --accent:#17694a; --accent-ink:#f3fbf6; --plus:#1c52a0; --minus:#bf3528; --gold:#9c700f; --stick:#fffdf5; --dot:#d2382a;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --surface-2:#202a25; --line:#2f3c35; --fg:#e6ede8; --muted:#9aa89f;
  --accent:#45b487; --accent-ink:#04140c; --plus:#8ab7ff; --minus:#ff8c7c; --gold:#e3b650; --stick:#ebe6d6; --dot:#e2493a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --surface-2:#202a25; --line:#2f3c35; --fg:#e6ede8; --muted:#9aa89f;
  --accent:#45b487; --accent-ink:#04140c; --plus:#8ab7ff; --minus:#ff8c7c; --gold:#e3b650; --stick:#ebe6d6; --dot:#e2493a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:900px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.top{padding-block:20px 8px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.7rem;letter-spacing:.04em;line-height:1.2}
.stick{display:inline-block;width:72px;height:11px;border-radius:6px;background:var(--stick);border:1px solid var(--line);position:relative;flex:none}
.stick i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--dot)}
.stick.big{width:120px;height:16px;border-radius:8px}
.stick.big i{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:700;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
main{display:flex;flex-direction:column;gap:24px;padding-top:20px}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.88rem}
.notice{background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:.9rem;color:var(--muted)}
.num,.pt,.raw,.tot td,.period,.rv{font-family:var(--num);font-variant-numeric:tabular-nums}
.plus{color:var(--plus)} .minus{color:var(--minus)} .zero{color:var(--muted)}
/* controls */
.btn{appearance:none;font:inherit;font-weight:700;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 16px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--minus);border-color:var(--minus);color:var(--bg)}
.btn.danger-o{background:transparent;border-color:var(--minus);color:var(--minus)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.xs{padding:2px 8px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:var(--fg);min-width:0;width:100%}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
select.in{width:auto;max-width:100%}
.ykgrid select.in{width:100%}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.82rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.inrow{display:flex;gap:4px;align-items:stretch}
.sign{appearance:none;font:inherit;font-weight:700;width:34px;flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--minus);border-radius:8px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-start;max-width:100%}
.segb{appearance:none;font:inherit;font-size:.88rem;font-weight:700;background:var(--surface);color:var(--muted);border:0;padding:7px 13px;cursor:pointer;white-space:nowrap}
.segb+.segb{border-left:1px solid var(--line)}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{appearance:none;font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px;cursor:pointer}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mchip[data-locked]{cursor:default}
.addname{display:flex;gap:6px;max-width:420px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;gap:14px}
.rule{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.rule legend{font-size:.82rem;color:var(--muted);font-weight:700;padding:0;margin-bottom:6px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.uma{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.formfoot{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.msg{margin-right:auto;font-size:.88rem;color:var(--muted)}
.msg.err{color:var(--minus)}
.msg.ok{color:var(--accent)}
/* list of days */
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.day{appearance:none;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.day:hover{border-color:var(--accent)}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ddate{font-weight:700;font-size:1.05rem}
.dcount{color:var(--muted);font-size:.85rem}
.dmemo{color:var(--muted);font-size:.85rem}
.dres{display:flex;flex-wrap:wrap;gap:6px 18px}
.dr{display:inline-flex;align-items:baseline;gap:6px}
.dr .nm{font-size:.9rem}
.dr .pt{font-weight:600}
.ch{font-size:.8rem;color:var(--muted);font-family:var(--num)}
.none{color:var(--muted);font-size:.85rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:1px 7px;border:1px solid var(--accent);color:var(--accent);vertical-align:1px;white-space:nowrap}
.badge.m3{border-color:var(--gold);color:var(--gold)}
.badge.yk{border-color:var(--dot);color:var(--dot)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:28px 20px;border:1px dashed var(--line);border-radius:12px}
.e1{font-weight:700;font-size:1.05rem}
.e2{color:var(--muted);font-size:.9rem;max-width:34em}
/* session */
.crumb{margin-bottom:-10px}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dh-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.dayhead h2{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.03em}
.meta{color:var(--muted);font-size:.86rem}
.memo{font-size:.9rem}
.rank{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.rank li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.rank .pos{grid-row:1/5;font-family:var(--display);font-size:1.4rem;color:var(--muted);line-height:1}
.rank li:first-child .pos{color:var(--gold)}
.rank .nm{font-weight:700}
.pt.big{font-size:1.35rem;font-weight:600;line-height:1.3}
.rank .sub{font-size:.8rem;color:var(--muted)}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:.82rem;color:var(--muted);font-weight:700;text-align:center;background:var(--surface-2)}
.score td{text-align:center;vertical-align:middle}
.score .no{font-family:var(--num);color:var(--muted);font-weight:500;width:3em}
.score .pt{display:block;font-weight:600;font-size:1.02rem}
.score .raw{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted)}
.score .out{color:var(--muted);font-size:.8rem}
.score .act{width:1%;text-align:right}
.score tr.editing td,.score tr.editing th{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tags{display:flex;gap:4px;justify-content:center;margin-top:2px}
.tag{font-size:.68rem;font-weight:700;border-radius:4px;padding:0 5px;line-height:1.5}
.tag.tb{background:var(--minus);color:var(--bg)}
.tag.sh{border:1px solid var(--dot);color:var(--dot)}
.rk{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;font-size:.7rem;background:var(--surface-2);color:var(--muted);font-weight:600}
.rk.r1{background:var(--gold);color:var(--bg)}
.score tfoot th{font-size:.82rem;color:var(--muted);text-align:center}
.score tfoot td{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.score tfoot tr.sum td{font-size:1.08rem;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.score tbody tr:last-child td,.score tbody tr:last-child th{border-bottom:2px solid var(--line)}
.chip-in{width:5.5em;text-align:center;padding:5px 6px}
.chipcell{display:inline-flex;gap:4px}
.chipcell .sign{width:28px}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.gfield label{font-weight:700;color:var(--fg);font-size:.9rem;letter-spacing:0}
.tobi{appearance:none;font:inherit;font-size:.78rem;font-weight:700;align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:1px 10px;cursor:pointer}
.tobi[aria-pressed="true"]{background:var(--minus);border-color:var(--minus);color:var(--bg)}
.danger{align-items:flex-start;padding-top:8px;border-top:1px solid var(--line)}
/* yakuman */
.ykbox{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.yklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.yklist li{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:.92rem}
.yklist .muted{color:var(--muted);font-size:.85rem}
.yklist .when{color:var(--muted);font-size:.82rem;font-family:var(--num);min-width:6.5em}
.ykform{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px}
.ykgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.rkform{display:flex;flex-direction:column;gap:8px}
.rkrow{display:grid;grid-template-columns:2.6em minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center}
.rkrow select.in{width:100%}
.rkl{font-family:var(--display);font-size:1.05rem;color:var(--muted)}
.rkl.r1{color:var(--gold)}
.auto{display:block;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-weight:600;color:var(--muted);font-family:var(--num)}
.auto.filled{color:var(--fg);border-style:solid;background:var(--surface-2)}
.tbrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbrow select.in{width:auto}
.tbrow .muted{color:var(--muted);font-size:.85rem}
.preview{font-family:var(--num);font-size:.86rem;background:var(--surface-2);border-radius:8px;padding:8px 12px}
.preview:empty{display:none}
.ykparts{display:flex;flex-direction:column;gap:6px}
.ykpart{display:grid;grid-template-columns:minmax(0,1fr) 4.6em auto auto;gap:6px;align-items:center}
.ykpart .tobi{align-self:center;padding:4px 10px}
.settle{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.settle .rates{width:100%}
.settle .rates .segb{flex:1;padding:8px 2px;font-size:.84rem}
.settle-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.settle-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:baseline;padding:8px 2px;border-top:1px solid var(--line)}
.settle-list li:first-child{border-top:0}
.settle-list .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settle-list .pts{grid-column:1;grid-row:2;font-family:var(--num);font-size:.78rem;color:var(--muted)}
.settle-list .yen{grid-column:2;grid-row:1/3;align-self:center;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.2rem}
.seatbar{position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:14px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.seatbar .stick{border-color:transparent;flex:none}
.seatbar-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.seatbar-t{font-family:var(--display);font-size:1.35rem;letter-spacing:.06em;line-height:1.2}
.seatbar-s{font-size:.86rem;opacity:.9}
.badge.seat{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.score tr.ykrow th,.score tr.ykrow td{background:color-mix(in srgb,var(--dot) 7%,transparent);padding-top:4px;padding-bottom:4px}
.score tr.ykrow .tag.yk{border:1px solid var(--dot);color:var(--dot);font-size:.66rem;font-weight:700;border-radius:4px;padding:0 4px}
.score tr.ykrow .ykn{display:block;font-family:var(--body);font-size:.62rem;line-height:1.25;color:var(--muted);word-break:break-all;margin-top:2px}
.chiphead{display:flex;flex-direction:column;gap:2px}
.chip-t{font-weight:700;font-size:.95rem}
.chip-t b{color:var(--accent);font-size:1.05rem}
.chip-s{font-size:.8rem;color:var(--muted)}
.chipform .inrow{align-items:center}
.chipform .unit{flex:none;font-weight:700;color:var(--accent);padding:0 2px 0 4px}
.chipform .cv{font-family:var(--num);font-size:.76rem;color:var(--muted);min-height:1.1em}
.once{font-size:.84rem;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:8px;padding:6px 10px}
.once b{color:var(--gold)}
.dupwarn{display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--minus) 10%,transparent);border:1px solid var(--minus);border-radius:10px;padding:10px 12px;font-size:.88rem}
.dupwarn .formfoot{justify-content:flex-start}
#addgame .gform .inrow{align-items:center}
#addgame .gform .unit{flex:none;font-family:var(--num);font-weight:600;color:var(--muted);padding:0 2px 0 3px;font-size:1rem}
/* totals */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.period{color:var(--muted);font-size:.85rem}
.tot th,.tot td{text-align:left}
.tot .r{text-align:right}
.tot td.r{font-weight:500}
.tot td.ptc{font-weight:600;font-size:1.05rem;text-align:right}
.tot td.nmc{font-family:var(--body);font-weight:700}
.tot .pos{color:var(--muted);width:2em}
.barcol{width:26%;min-width:100px}
.bar{display:block;position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.bar i.plus{background:var(--plus)} .bar i.minus{background:var(--minus)} .bar i.zero{background:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rcard h3{display:flex;align-items:baseline;gap:8px;font-size:.95rem}
.rcard h3 small{font-size:.75rem;color:var(--muted);font-weight:400}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rlist li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;column-gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--line)}
.rlist li:first-child{border-top:0}
.rlist .rp{font-family:var(--num);color:var(--muted);font-weight:600}
.rlist li.first .rp{color:var(--gold)}
.rlist .rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .rv{font-weight:600;text-align:right}
.rlist .rs{grid-column:2/4;font-size:.76rem;color:var(--muted);margin-top:-2px}
.rcard .nodata{color:var(--muted);font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* settings */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow .in{max-width:220px}
.prow .sub{color:var(--muted);font-size:.82rem}
.prow .nm{font-weight:700;min-width:6em}
.help{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.92rem;max-width:40em}
.rules{margin:0;padding-left:1.2em;font-size:.92rem}
#json-box textarea{width:100%;min-height:140px;font-family:var(--num);font-size:.78rem}
/* seat change */
.seat-ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 50%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.seat-card{background:var(--surface);color:var(--fg);border-radius:16px;padding:28px 28px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:320px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

function parseScore(str){const t=norm(str);if(t==='')return null;if(!/^[+-]?\d+$/.test(t))return NaN;return parseInt(t,10)*100;}
function parsePtIn(str){const t=norm(str);if(t==='')return null;if(!/^[+-]?\d+(\.\d+)?$/.test(t))return NaN;return parseFloat(t);}
function parseIntLoose(str){const t=norm(str);if(t==='')return 0;if(!/^[+-]?\d+$/.test(t))return NaN;return parseInt(t,10);}

/* 役満: 1回の和了に複合した役を yakus:[{name,mult,pao}] で持つ（古い記録は name/pao から読み替え） */
const DOUBLE_YAKU=['大四喜','純正九蓮宝燈','純正九蓮','国士無双十三面待ち','国士無双十三面','国士十三面','四暗刻単騎','四暗刻単騎待ち','スッタン'];

/* ---------- calculation ---------- */
function gameIds(s,g){
  if(Array.isArray(g.order))return g.order.filter(id=>typeof (g.pts||{})[id]==='number');
  const src=g.pts||g.scores||{};
  const ids=s.members.filter(id=>typeof src[id]==='number');
  Object.keys(src).forEach(id=>{if(!ids.includes(id)&&typeof src[id]==='number')ids.push(id);});
  return ids;

/* who pays the yakuman shugi: tsumo = everyone pays `amount`; ron = discarder pays amount×(n−1);
   pao: ron → discarder and pao player split; tsumo → pao player pays in full */
function shugiPay(y,ids){
  const pay={};if(!ids.includes(y.pid))return pay;
  if(y.how==='ron'&&(!ids.includes(y.from)||y.from===y.pid))return pay;
  const base=Number(y.amount)||0,others=ids.filter(o=>o!==y.pid);
  const add=(id,v)=>{pay[id]=(pay[id]||0)+v;};
  const paoP=y.pao&&ids.includes(y.pao)&&y.pao!==y.pid?y.pao:null;
  /* 複合役満は役ごとに計算。包が付いた役の分だけ包のルール、それ以外の役の分は普通に払う */
  yakuParts(y).forEach(c=>{
    const unit=base*(Number(c.mult)||1),total=unit*others.length;if(!total)return;
    const pao=c.pao?paoP:null;
    if(y.how==='ron'){if(pao&&pao!==y.from){add(y.from,-total/2);add(pao,-total/2);}else add(y.from,-total);}
    else if(pao)add(pao,-total);
    else others.forEach(o=>add(o,-unit));
    add(y.pid,total);
  });

}
function gameResult(s,g){
  if(g.summary){const o={};Object.keys(g.pts||{}).forEach(id=>{o[id]={rank:null,pt:g.pts[id],raw:null,shugi:0,tobi:false,bust:0,summary:true};});return o;}
  const r=s.rule,ids=gameIds(s,g),out={},tob=g.tobis||[];
  if(g.pts){

  }else{
    const order=ids.slice().sort((a,b)=>(g.scores[b]-g.scores[a])||(ids.indexOf(a)-ids.indexOf(b)));
    /* 同じ素点の人は同着：順位点を平均して分け合い、同じスコアになる。1位グループは残り全員の合計を等分 */
    const n=order.length,groups=[];
    order.forEach((id,i)=>{const gr=groups[groups.length-1];if(gr&&g.scores[gr.ids[0]]===g.scores[id]){gr.ids.push(id);gr.pos.push(i);}else groups.push({ids:[id],pos:[i]});});
    let rest=0;
    groups.forEach(gr=>{
      const tie=gr.ids.length>1,last=gr.pos.includes(n-1);
      gr.ids.forEach(id=>{out[id]={rank:gr.pos[0]+1,raw:g.scores[id],tie,last};});
      if(gr.pos[0]===0)return;

    });

    const adj={};
    tob.forEach(t=>{if(!out[t.pid]||!t.by||!out[t.by]||t.by===t.pid)return;adj[t.pid]=(adj[t.pid]||0)-r.tobi;adj[t.by]=(adj[t.by]||0)+r.tobi;});
    const sh={};(g.yaku||[]).forEach(y=>{const p=shugiPay(y,order);for(const k in p)sh[k]=(sh[k]||0)+p[k];});
    order.forEach(id=>{out[id].shugi=r1(sh[id]||0);out[id].tobiAdj=adj[id]||0;out[id].pt=r1(out[id].base+(adj[id]||0)+(sh[id]||0));});
  }
  for(const id in out){out[id].tobi=tob.some(t=>t.pid===id)||(out[id].raw!==null&&out[id].raw<0);out[id].bust=tob.filter(t=>t.by===id&&out[t.pid]).length;}
  return out;
}
const gCount=g=>g.summary?(g.count||1):1;
function ymd(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function isRecent(s){const d=new Date();return s.date===ymd(d)||s.date===ymd(new Date(d.getTime()-86400000));}

  const t={};const mk=()=>({pt:0,games:0,chip:0,chipN:0});

  for(const id in (s.chips||{})){if(!t[id])t[id]=mk();t[id].chip=s.chips[id]||0;t[id].chipN=r1(t[id].chip/s.rule.chip);}

function filtered(mode,year){return data.sessions.filter(s=>(mode==='all'||String(s.mode)===mode)&&(year==='all'||s.date.slice(0,4)===year));}
function stats(list){
  const t={};const mk=()=>({pt:0,games:0,played:0,r:[0,0,0,0],rankSum:0,last:0,tobi:0,bust:0,best:null,chip:0,chipN:0,shugi:0,yaku:0,ykList:[],hoju:0,days:0});

      ids.forEach(id=>{const x=get(id),v=r[id];x.pt+=v.pt;x.games++;x.played++;x.r[v.rank-1]++;x.rankSum+=v.rank;if(v.last!==undefined?v.last:v.rank===n)x.last++;if(v.tobi)x.tobi++;x.bust+=v.bust;
        const bp=r1(v.pt-(v.shugi||0));if(!x.best||bp>x.best.pt)x.best={pt:bp,raw:v.raw,date:s.date};seen.add(id);});
      (g.yaku||[]).forEach(y=>{if(!r[y.pid])return;const w=get(y.pid);w.yaku++;w.ykList.push(yakuNames(y)+'・'+(y.how==='tsumo'?'ツモ':'ロン'));if(y.how==='ron'&&r[y.from])get(y.from).hoju++;const p=shugiPay(y,ids);for(const k in p)get(k).shugi+=p[k];});
    });
    for(const id in (s.chips||{})){const c=s.chips[id]||0;if(!c)continue;get(id).chip+=c;get(id).chipN+=c/s.rule.chip;seen.add(id);}
    seen.forEach(id=>get(id).days++);
  });
  for(const id in t){t[id].pt=r1(t[id].pt);t[id].shugi=r1(t[id].shugi);t[id].chipN=r1(t[id].chipN);t[id].total=r1(t[id].pt+t[id].chip);}
  return t;
}

/* ---------- saving (the page is the record) ---------- */
function applyOp(d,op){
  const x=d.sessions.find(y=>y.id===op.sid);if(!x)return;
  if(op.t==='game'){const g=clone(op.game);const i=x.games.findIndex(q=>q.id===g.id);if(i>=0){g.seq=x.games[i].seq;x.games[i]=g;}else{g.seq=Date.now();x.games.push(g);}}
  else if(op.t==='chips')x.chips=clone(op.chips);
}
/* ---------- saving: only the documents that changed are written ---------- */
function stable(v){if(Array.isArray(v))return '['+v.map(stable).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';return JSON.stringify(v);}
function flatten(d){
  const m=new Map();
  d.players.forEach((p,i)=>m.set('players/'+p.id,{name:p.name,created:p.created||i}));
  d.sessions.forEach(s=>{const meta=clone(s);delete meta.id;delete meta.games;m.set('sessions/'+s.id,meta);
    (s.games||[]).forEach((g,i)=>{const x=clone(g);delete x.id;x.sid=s.id;if(typeof x.seq!=='number')x.seq=i;m.set('games/'+g.id,x);});});
  m.set('config/defaults',clone(d.defaults));
  return m;
}
function diffWrites(prev,next){
  const a=flatten(prev),b=flatten(next),w=[];
  b.forEach((v,k)=>{if(!a.has(k)||stable(a.get(k))!==stable(v))w.push({k,v});});
  a.forEach((v,k)=>{if(!b.has(k))w.push({k,del:true});});
  return w;
}
async function commitWrites(w){
  for(let i=0;i<w.length;i+=400){
    const b=writeBatch(db);
    w.slice(i,i+400).forEach(x=>{const [c,id]=x.k.split('/');const r=doc(db,c,id);if(x.del)b.delete(r);else b.set(r,x.v);});
    await b.commit();
  }
}
function save(mutate,opts){
  opts=opts||{};
  if(canWrite!==true){toast('記録するには、右上の「記録する」から合言葉を入れてください');return false;}
  const prev=data;const next=clone(data);
  mutate(next);
  const w=diffWrites(prev,next);
  data=next;
  if(opts.ui)Object.assign(ui,opts.ui);
  if(opts.before)opts.before();
  persistUi();render();
  if(!w.length){toast(opts.done||'保存しました');return true;}
  busy=true;setTimeout(()=>{busy=false;},400);
  commitWrites(w).then(()=>{},e=>{
    const code=e&&e.code||'error';
    data=loaded?compose():prev;render();
    toast(code==='permission-denied'?'書き込みが許可されませんでした。合言葉でログインし直してください':'保存できませんでした（'+code+'）。もう一度押してください');
  });
  toast(opts.done||'保存しました');
  return true;
}

function readRule(p,mode){
  const start=parseIntLoose($('#'+p+'-start').value),ret=parseIntLoose($('#'+p+'-ret').value);
  if(!(start>0)||!(ret>0))return {err:'持ち点と返しを数字で入れてください'};
  const uma=[0];
  for(let i=1;i<mode;i++){const v=parseNum($('#'+p+'-uma-'+i).value);if(!isFinite(v))return {err:(i+1)+'位の順位点を数字で入れてください'};uma.push(v);}
  uma[0]=r1((ret-start)*mode/1000-uma.slice(1).reduce((a,b)=>a+b,0));
  const tobi=parseNum($('#'+p+'-tobi').value),shugi=parseNum($('#'+p+'-shugi').value);
  if(!isFinite(tobi)||!isFinite(shugi)||tobi<0||shugi<0)return {err:'トビと役満祝儀を0以上の数字で入れてください'};
  const chip=parseNum($('#'+p+'-chip').value);
  if(!(chip>0))return {err:'チップ1枚の点数を0より大きい数字で入れてください'};
  return {rule:{start,ret,uma,tobi,shugi,chip}};
}

function fillGameForm(g){

  if(g.pts&&Array.isArray(g.order)){
    const rr=gameResult(cur(),g);
    g.order.forEach((id,i)=>{const sel=document.getElementById('gs-'+i);if(sel)sel.value=id;if(i>0){const el=document.getElementById('gv-'+i);if(el)el.value=String(rr[id]?rr[id].base:g.pts[id]);}});

    +'<div class="formfoot"><span class="msg" id="c-msg"></span><button class="btn sm" data-act="save-chips">チップを保存</button></div></div>';

  }

function rankCard(title,note,rows){
  if(!rows.length)return '<div class="rcard"><h3>'+title+(note?'<small>'+note+'</small>':'')+'</h3><p class="nodata">対象の記録がまだありません</p></div>';
  let pos=0,prev=null;
  return '<div class="rcard"><h3>'+title+(note?'<small>'+note+'</small>':'')+'</h3><ol class="rlist">'+rows.map((r,i)=>{
    if(prev===null||Math.abs(r.v-prev)>1e-9)pos=i+1;prev=r.v;
    return '<li class="'+(pos===1?'first':'')+'"><span class="rp">'+pos+'</span><span class="rn">'+esc(pName(r.id))+'</span><span class="rv '+(r.cls||'')+'">'+r.label+'</span>'+(r.sub?'<span class="rs">'+r.sub+'</span>':'')+'</li>';
  }).join('')+'</ol></div>';
}
function renderTotals(){
  const has4=data.sessions.some(s=>s.mode===4),has3=data.sessions.some(s=>s.mode===3);
  if(!ui.tMode)ui.tMode=(has4||!has3)?'4':'3';
  const years=[...new Set(data.sessions.map(s=>s.date.slice(0,4)))].sort().reverse();
  if(ui.tYear!=='all'&&!years.includes(ui.tYear))ui.tYear='all';
  const tMin=Number(ui.tMin)||0;
  let h='<div class="sechead"><h2>成績・ランキング</h2></div><div class="filters"><div class="seg" role="group" aria-label="人数">'
    +[['4','四麻'],['3','三麻'],['all','すべて']].map(x=>'<button class="segb" data-act="tmode" data-v="'+x[0]+'" aria-pressed="'+(ui.tMode===x[0])+'">'+x[1]+'</button>').join('')+'</div>'
    +'<select class="in" id="t-year" aria-label="期間"><option value="all">全期間</option>'+years.map(y=>'<option value="'+y+'"'+(ui.tYear===y?' selected':'')+'>'+y+'年</option>').join('')+'</select>'
    +'<select class="in" id="t-min" aria-label="率ランキングの対象">'+[0,5,10,20,50].map(n=>'<option value="'+n+'"'+(tMin===n?' selected':'')+'>'+(n?'率は'+n+'半荘以上':'率は全員')+'</option>').join('')+'</select></div>';
  if(ui.tMode==='all')h+='<p class="hint">四麻と三麻をまとめて集計しています。ラスは三麻なら3位です。</p>';
  const list=filtered(ui.tMode,ui.tYear);const t=stats(list);
  const ids=Object.keys(t).filter(id=>t[id].played>0||t[id].chip);
  if(!ids.length)return h+'<div class="empty"><p class="e1">この条件の記録はまだありません</p><p class="e2">対局記録に半荘を追加すると、ここに累計スコアとランキングが出ます。</p></div>';
  const games=list.reduce((a,s)=>a+totalGames(s),0);
  const key=ui.tSort==='score'?'pt':'total';
  const byPt=ids.slice().sort((a,b)=>t[b][key]-t[a][key]||t[b].pt-t[a].pt);
  const maxAbs=Math.max(1,...byPt.map(id=>Math.abs(t[id][key])));
  const cell=(v,on)=>'<td class="'+(on?'ptc':'r')+' '+sc(v)+'">'+fmtTot(v)+'</td>';
  h+='<section><div class="sechead"><h3>累計スコア</h3><div class="seg" role="group" aria-label="並び順">'+[['total','チップ込み順'],['score','スコア順']].map(x=>'<button class="segb" data-act="tsort" data-v="'+x[0]+'" aria-pressed="'+((x[0]==='score')===(key==='pt'))+'">'+x[1]+'</button>').join('')+'</div></div>'
    +'<p class="period">'+list.length+'日・半荘'+games+'回</p><div class="table-scroll tot-wrap"><table class="tot"><thead><tr><th scope="col">#</th><th scope="col">名前</th><th scope="col" class="r">チップ込み</th><th scope="col" class="r">スコア</th><th scope="col" class="r">チップ</th><th scope="col" class="barcol"><span class="sr">'+(key==='pt'?'スコア':'チップ込み')+'の棒</span></th><th scope="col" class="r">半荘</th><th scope="col" class="r">平均順位</th><th scope="col" class="r">参加</th></tr></thead><tbody>'
    +byPt.map((id,i)=>{const x=t[id];const v=x[key];const wpct=(Math.abs(v)/maxAbs*50).toFixed(1);
      return '<tr><td class="pos">'+(i+1)+'</td><td class="nmc">'+esc(pName(id))+'</td>'+cell(x.total,key==='total')+cell(x.pt,key==='pt')+cell(x.chip,false)+'<td class="barcol"><span class="bar"><i class="'+sc(v)+'" style="'+(v>=0?'left':'right')+':50%;width:'+wpct+'%"></i></span></td><td class="r">'+x.played+'</td><td class="r">'+(x.games?(x.rankSum/x.games).toFixed(2):'—')+'</td><td class="r">'+x.days+'日</td></tr>';}).join('')
    +'</tbody></table></div>'
    +'<ol class="totlist">'+byPt.map((id,i)=>{const x=t[id];const v=x[key];const wpct=(Math.abs(v)/maxAbs*50).toFixed(1);
      return '<li><span class="tp'+(i===0?' first':'')+'">'+(i+1)+'</span><span class="tn">'+esc(pName(id))+'</span><span class="tv '+sc(v)+'">'+fmtTot(v)+'</span>'
        +'<span class="ts">'+(key==='pt'?'チップ込み <b class="'+sc(x.total)+'">'+fmtTot(x.total)+'</b>':'スコア <b class="'+sc(x.pt)+'">'+fmtTot(x.pt)+'</b>')+'・チップ <b class="'+sc(x.chip)+'">'+fmtChip(x.chip)+'</b></span>'
        +'<span class="ts">'+x.played+'半荘・平均順位 '+(x.games?(x.rankSum/x.games).toFixed(2):'—')+'・'+x.days+'日参加</span>'
        +'<span class="bar"><i class="'+sc(v)+'" style="'+(v>=0?'left':'right')+':50%;width:'+wpct+'%"></i></span></li>';}).join('')+'</ol></section>';
  const yks=[];
  list.forEach(s=>{const nos=gameNos(s);s.games.forEach((g,i)=>(g.yaku||[]).forEach(y=>yks.push({s,y,no:nos[i].label,st:nos[i].start})));});
  yks.sort((a,b)=>b.s.date.localeCompare(a.s.date)||b.st-a.st);
  h+='<section><h3>役満の記録</h3>'+(yks.length?'<ul class="yklist">'+yks.map(o=>'<li><span class="when">'+shortDate(o.s.date)+' 半荘'+o.no+'</span><b>'+esc(pName(o.y.pid))+'</b><span>'+esc(yakuNames(o.y))+'</span><span class="muted">'+yakuDesc(o.y,o.s.mode)+'</span></li>').join('')+'</ul>':'<p class="hint">この条件ではまだ役満は出ていません。</p>')+'</section>';
  const played=ids.filter(id=>t[id].games>0);
  const rated=played.filter(id=>t[id].games>=tMin);
  const minNote=tMin?tMin+'半荘以上':'';
  const note=(...a)=>a.filter(Boolean).join('・');
  const rateRows=(fn,dir,cnt)=>rated.map(id=>({id,v:fn(t[id])})).sort((a,b)=>dir*(a.v-b.v)||t[b.id].games-t[a.id].games).map(r=>({id:r.id,v:r.v,label:pct(r.v),sub:cnt(t[r.id])+' / '+t[r.id].games+'半荘'}));
  const cards=[];
  cards.push(rankCard('チップ','枚数',ids.map(id=>({id,v:t[id].chipN})).sort((a,b)=>b.v-a.v).map(r=>({id:r.id,v:r.v,label:fmtMai(r.v),cls:sc(r.v),sub:'スコア換算 '+fmtChip(t[r.id].chip)+'・'+t[r.id].days+'日参加'}))));
  cards.push(rankCard('平均順位',note('小さい順',minNote),rated.map(id=>({id,v:t[id].rankSum/t[id].games})).sort((a,b)=>a.v-b.v||t[b.id].games-t[a.id].games).map(r=>({id:r.id,v:r.v,label:r.v.toFixed(2),sub:t[r.id].r.map((c,i)=>(i+1)+'位'+c).slice(0,ui.tMode==='3'?3:4).join(' ')}))));
  cards.push(rankCard('トップ率',minNote,rateRows(x=>x.r[0]/x.games,-1,x=>'トップ'+x.r[0])));
  cards.push(rankCard('連対率',minNote,rateRows(x=>(x.r[0]+x.r[1])/x.games,-1,x=>'1・2位'+(x.r[0]+x.r[1]))));
  cards.push(rankCard('ラス回避率',minNote,rateRows(x=>1-x.last/x.games,-1,x=>'ラス'+x.last+'回')));
  cards.push(rankCard('トビ回避率',minNote,rateRows(x=>1-x.tobi/x.games,-1,x=>'トビ'+x.tobi+'回')));
  cards.push(rankCard('トップ回数','',played.map(id=>({id,v:t[id].r[0]})).sort((a,b)=>b.v-a.v||t[a.id].games-t[b.id].games).map(r=>({id:r.id,v:r.v,label:r.v+'回',sub:t[r.id].games+'半荘中'}))));

/* ---------- live form feedback ---------- */
function cur(){return data.sessions.find(x=>x.id===ui.sid);}
function readPt(s){
  const n=s.mode,order=[],vals={};let missing=0,bad=false,dup=false;
  for(let i=0;i<n;i++){
    const sel=document.getElementById('gs-'+i);const id=sel?sel.value:'';
    if(order.includes(id))dup=true;order.push(id);
    if(i===0)continue;
    const v=parsePtIn((document.getElementById('gv-'+i)||{}).value);
    if(v===null)missing++;else if(Number.isNaN(v))bad=true;else vals[id]=v;
  }
  let sum=0;for(const k in vals)sum+=vals[k];
  return {order,vals,missing,bad,dup,top:r1(-sum)};
}
function readRaw(s){
  const vals={};let filled=0,bad=false;const empty=[];
  s.members.forEach(id=>{const el=document.getElementById('g-'+id);if(!el)return;const v=parseScore(el.value);if(v===null){empty.push(id);return;}if(Number.isNaN(v)){bad=true;return;}vals[id]=v;filled++;});
  if(s.members.length===s.mode&&filled===s.mode-1&&empty.length===1&&!bad){let sum=0;for(const k in vals)sum+=vals[k];vals[empty[0]]=s.rule.start*s.mode-sum;filled++;return {vals,filled,bad,empty,auto:empty[0]};}
  return {vals,filled,bad,empty,auto:null};
}
function readSum(s){
  const vals={};let filled=0,bad=false;const empty=[];
  s.members.forEach(id=>{const el=document.getElementById('g-'+id);if(!el)return;const v=parsePtIn(el.value);if(v===null){empty.push(id);return;}if(Number.isNaN(v)){bad=true;return;}vals[id]=v;filled++;});
  if(s.members.length===s.mode&&filled===s.mode-1&&empty.length===1&&!bad){let sum=0;for(const k in vals)sum+=vals[k];vals[empty[0]]=r1(-sum);filled++;return {vals,filled,bad,auto:empty[0]};}
  return {vals,filled,bad,auto:null};
}
function refreshTobi(){const a=$('#tb-area');const s=cur();if(a&&s)a.innerHTML=tobiArea(s);}
function ykSumText(){const el=document.getElementById('yk-sum');if(!el)return;const m=ykParts.reduce((a,c)=>a+(Number(c.mult)||1),0);el.firstChild&&(el.firstChild.nodeValue=multName(m)+'（祝儀×'+m+'）。ツモは全員からオール、ロンは放銃者が全員分を払います。包の付いた役の分だけ、ロンなら放銃者と包の人で折半、ツモなら包の人が全額払い、ほかの役の分は普通に払います。');}

function syncRawTobi(vals){
  const s=cur();const busted=s.members.filter(id=>typeof vals[id]==='number'&&vals[id]<0);
  const next=busted.map(pid=>({pid,by:(gTobi.find(t=>t.pid===pid)||{}).by||''}));
  if(next.map(t=>t.pid).join()!==gTobi.map(t=>t.pid).join()){gTobi=next;refreshTobi();}
}
function updateGameSum(){
  const s=cur();if(!s||!document.getElementById('g-msg'))return;
  mismatchArmed=false;dupArmed=false;const btn=$('#g-submit');if(btn)btn.textContent=submitLabel();
  if(gKind==='sum'){
    const g=readSum(s);
    s.members.forEach(id=>{const el=document.getElementById('g-'+id);if(el)el.placeholder=id===g.auto?'自動: '+g.vals[id]:'0';});
    if(g.bad)return setMsg('g-msg','数字以外が入っています','err');
    if(g.filled<s.mode)return setMsg('g-msg',g.filled+' / '+s.mode+' 人入力済み','');
    let sum=0;for(const k in g.vals)sum+=g.vals[k];
    return Math.abs(sum)>=0.05?setMsg('g-msg','合計が '+fmtPt(r1(sum))+'（0になっていません）','err'):setMsg('g-msg','合計 ±0（OK）','ok');
  }
  if(gKind==='pt'){
    const g=readPt(s);const out=$('#gv-0');
    if(out){out.textContent=g.missing||g.bad?'自動':fmtPt(g.top);out.classList.toggle('filled',!(g.missing||g.bad));}
    if(g.dup)return setMsg('g-msg','同じ人が2つの順位に入っています','err');
    if(g.bad)return setMsg('g-msg','数字以外が入っています','err');
    if(g.missing)return setMsg('g-msg','2位〜'+s.mode+'位のスコアを入れてください（あと'+g.missing+'人）','');
    return setMsg('g-msg','1位 '+pName(g.order[0])+' は '+fmtPt(g.top)+' になります','ok');
  }
  const g=readRaw(s);const prev=$('#g-prev');
  s.members.forEach(id=>{const el=document.getElementById('g-'+id);if(el)el.placeholder=id===g.auto?'自動: '+(g.vals[id]/100):String(s.rule.start/100);});
  if(g.bad){if(prev)prev.textContent='';return setMsg('g-msg','数字以外が入っています','err');}
  syncRawTobi(g.vals);
  const target=s.rule.start*s.mode;let sum=0;for(const k in g.vals)sum+=g.vals[k];
  if(g.filled<s.mode){if(prev)prev.textContent='';return setMsg('g-msg',g.filled+' / '+s.mode+' 人入力済み','');}
  const r=gameResult(s,{scores:g.vals,tobis:gTobi,yaku:gYaku});
  if(prev)prev.textContent=Object.keys(r).sort((a,b)=>r[a].rank-r[b].rank).map(id=>r[id].rank+'位 '+pName(id)+' '+fmtPt(r[id].pt)).join('　');
  const needBy=gTobi.some(t=>!t.by);
  if(sum!==target)return setMsg('g-msg','素点の合計 '+fmtScore(sum)+'（'+fmtScore(target)+' になっていません）','err');
  setMsg('g-msg',needBy?'飛ばした人を選ぶとトビの点が入ります':'素点の合計 '+fmtScore(sum)+'（OK）',needBy?'err':'ok');
}
function updateChipSum(){

  Object.keys(dayTotals(s)).forEach(id=>{const el=document.getElementById('c-'+id);if(!el)return;const v=parseIntLoose(el.value);if(Number.isNaN(v))bad=true;else sum+=v;});

    const s=cur();const g=s.games.find(x=>x.id===b.dataset.gid);if(!g)return;
    gEditId=g.id;gKind=g.summary?'sum':g.pts?'pt':'raw';gYaku=clone(g.yaku||[]);gTobi=clone(g.tobis||[]);ykOpen=false;ykHow='tsumo';ykParts=[];
    render();const f=$('#addgame');if(f)f.scrollIntoView({block:'start',behavior:'smooth'});
  },
  'g-cancel'(){resetGameForm();render();},
  'g-clear'(){resetGameForm();render();toast('入力を消しました');},
  'yk-open'(){ykOpen=true;ykHow='tsumo';ykParts=[newYkPart()];ykPid=ykFrom=ykPaoWho=ykAmt=null;refreshYaku();const el=$('#yk-name-0');if(el)el.focus();},
  'yk-padd'(){syncYk();ykParts.push(newYkPart());refreshYaku();const el=$('#yk-name-'+(ykParts.length-1));if(el)el.focus();},
  'yk-prm'(b){syncYk();ykParts.splice(Number(b.dataset.i),1);refreshYaku();},
  'yk-ppao'(b){syncYk();const c=ykParts[Number(b.dataset.i)];if(c)c.pao=!c.pao;refreshYaku();},
  'yk-cancel'(){ykOpen=false;refreshYaku();},
  'yk-how'(b){
    ykHow=b.dataset.v;
    document.querySelectorAll('[data-act="yk-how"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    $('#yk-from-f').hidden=ykHow!=='ron';
  },
  'yk-add'(){
    syncYk();
    const parts=ykParts.filter(c=>c.name).map(c=>({name:c.name,mult:Number(c.mult)||1,pao:!!c.pao}));
    if(parts.some(c=>/数え/.test(c.name)))return setMsg('yk-msg','数え役満は祝儀の対象外です（本役満だけ記録できます）','err');
    if(!parts.length)return setMsg('yk-msg','役の名前を入れてください','err');
    const amt=parseNum(ykAmt);
    if(!isFinite(amt)||amt<0)return setMsg('yk-msg','祝儀を0以上の数字で入れてください','err');
    const y={pid:ykPid,name:parts.map(c=>c.name).join('＋'),how:ykHow,amount:amt,yakus:parts};
    if(ykHow==='ron'){y.from=ykFrom;if(y.from===y.pid)return setMsg('yk-msg','和了した人と放銃した人が同じです','err');}
    if(parts.some(c=>c.pao)){y.pao=ykPaoWho;if(y.pao===y.pid)return setMsg('yk-msg','和了した人と包の人が同じです','err');}
    gYaku.push(y);ykOpen=false;ykParts=[];refreshYaku();updateGameSum();
  },
  'yk-del'(b){gYaku.splice(Number(b.dataset.i),1);refreshYaku();updateGameSum();},
  'add-game'(){
    const s=cur();const game={id:gEditId||('g'+uid())};let ids;
    if(gKind==='pt'){
      const g=readPt(s);
      if(g.dup)return setMsg('g-msg','同じ人が2つの順位に入っています','err');
      if(g.bad)return setMsg('g-msg','数字以外が入っています','err');
      if(g.missing)return setMsg('g-msg','2位〜'+s.mode+'位のスコアを入れてください','err');
      ids=g.order;const pts={};ids.forEach((id,i)=>{pts[id]=i===0?g.top:g.vals[id];});
      game.order=ids;game.pts=pts;game.shugiSep=true;
    }else if(gKind==='sum'){
      const cnt=parseIntLoose(($('#g-cnt')||{}).value);
      if(!(cnt>=1))return setMsg('g-msg','何半荘分の合計かを入れてください','err');
      const g=readSum(s);
      if(g.bad)return setMsg('g-msg','数字以外が入っています','err');
      if(g.filled<s.mode)return setMsg('g-msg',s.mode+'人分のスコアを入れてください','err');
      let sum=0;for(const k in g.vals)sum+=g.vals[k];
      if(Math.abs(sum)>=0.05&&!mismatchArmed){mismatchArmed=true;$('#g-submit').textContent='ずれたまま保存';return setMsg('g-msg','合計が0になっていません。このままでよければもう一度押してください','err');}
      ids=Object.keys(g.vals);const p={};ids.forEach(id=>{p[id]=r1(g.vals[id]);});
      game.summary=true;game.count=cnt;game.pts=p;
    }else{
      const g=readRaw(s);
      if(g.bad)return setMsg('g-msg','数字以外が入っています','err');
      if(g.filled!==s.mode)return setMsg('g-msg',s.mode+'人分の素点を入れてください（いま'+g.filled+'人）','err');
      let sum=0;for(const k in g.vals)sum+=g.vals[k];
      if(sum!==s.rule.start*s.mode&&!mismatchArmed){mismatchArmed=true;$('#g-submit').textContent='ずれたまま保存';return setMsg('g-msg','素点の合計が '+fmtScore(s.rule.start*s.mode)+' になっていません。このままでよければもう一度押してください','err');}
      ids=Object.keys(g.vals);game.scores=g.vals;
      if(gTobi.some(t=>!t.by))return setMsg('g-msg','トビの「飛ばした人」を選んでください','err');
    }
    const seen=new Set();
    for(const t of gTobi){
      if(!ids.includes(t.pid))return setMsg('g-msg','トビの '+pName(t.pid)+' がこの半荘に入っていません','err');
      if(seen.has(t.pid))return setMsg('g-msg',pName(t.pid)+' のトビが2回記録されています','err');seen.add(t.pid);
      if(t.by&&(!ids.includes(t.by)||t.by===t.pid))return setMsg('g-msg','飛ばした人の選び方を確認してください','err');
    }
    for(const y of gYaku){
      if(!ids.includes(y.pid))return setMsg('g-msg','役満の '+pName(y.pid)+' がこの半荘に入っていません','err');
      if(y.how==='ron'&&!ids.includes(y.from))return setMsg('g-msg','放銃した '+pName(y.from)+' がこの半荘に入っていません','err');
      if(y.pao&&!ids.includes(y.pao))return setMsg('g-msg','包の '+pName(y.pao)+' がこの半荘に入っていません','err');
    }
    if(ykOpen&&[...document.querySelectorAll('.yk-name')].some(e=>e.value.trim()))return setMsg('g-msg','記録中の役満があります。「この役満を追加」か「やめる」を押してください','err');
    if(gTobi.length)game.tobis=clone(gTobi);
    if(gYaku.length)game.yaku=clone(gYaku);
    const editing=gEditId;
    if(!editing&&!dupArmed){
      const nos=gameNos(s);
      const nw=newSinceStart(s),same=s.games.find(g=>sameGame(g,game));
      if(nw.length||same){
        dupArmed=true;$('#g-submit').textContent='承知の上で記録する';
        const why=same?'同じスコアの半荘'+nos[s.games.indexOf(same)].label+'がもう記録されています。':'入力中に別の人が半荘'+nw.map(g=>nos[s.games.indexOf(g)].label).join('・')+'を記録しました。';
        return setMsg('g-msg',why+'二重登録でなければ、もう一度押すと記録します','err');
      }
    }
    const tg=totalGames(s);const idx=editing?s.games.findIndex(x=>x.id===editing):-1;
    const label=idx>=0?gameNos(s)[idx].label:(game.summary&&game.count>1?(tg+1)+'〜'+(tg+game.count):String(tg+1));
    const seatN=!editing&&!game.summary&&(tg+1)%4===0?tg+1:0;
    const op={t:'game',sid:s.id,game};
    if(save(d=>applyOp(d,op),{done:'半荘'+label+(editing?'を更新しました':'の記録を確定しました'),before:resetGameForm})&&seatN)showSeat(seatN);
  },
  'del-game'(b){
    const key='g:'+b.dataset.gid;if(confirmKey!==key){confirmKey=key;render();return;}
    const s=cur();confirmKey=null;
    save(d=>{const x=d.sessions.find(y=>y.id===s.id);x.games=x.games.filter(g=>g.id!==b.dataset.gid);},{done:'半荘を削除しました',before(){if(gEditId===b.dataset.gid)resetGameForm();}});
  },
  'save-chips'(){
    const s=cur();const chips={};let bad=false;
    Object.keys(dayTotals(s)).forEach(id=>{const el=document.getElementById('c-'+id);if(!el)return;const v=parseIntLoose(el.value);if(Number.isNaN(v))bad=true;else if(v)chips[id]=r1(v*s.rule.chip);});
    if(bad)return setMsg('c-msg','チップは枚数を整数で入れてください','err');
    const op={t:'chips',sid:s.id,chips};
    save(d=>applyOp(d,op),{done:'チップを保存しました'});
  },
  'del-session'(){
    const s=cur();const key='s:'+s.id;if(confirmKey!==key){confirmKey=key;render();return;}
    confirmKey=null;
    save(d=>{d.sessions=d.sessions.filter(y=>y.id!==s.id);},{ui:{sid:null},done:'対局日を削除しました',before:resetGameForm});
  },
  tmode(b){ui.tMode=b.dataset.v;persistUi();render();},
  tsort(b){ui.tSort=b.dataset.v;persistUi();render();},
  rate(b){rate=rate===b.dataset.v?null:b.dataset.v;try{if(rate)localStorage.setItem('mj-rate',rate);else localStorage.removeItem('mj-rate');}catch(e){}render({keep:true});},
  rename(b){
    const id=b.dataset.pid;const name=$('#pn-'+id).value.trim();
    if(!name)return setMsg('p-msg','名前を入れてください','err');
    if(data.players.some(p=>p.id!==id&&p.name===name))return setMsg('p-msg','同じ名前のメンバーがいます','err');
    save(d=>{d.players.find(p=>p.id===id).name=name;},{done:'名前を保存しました'});
  },
  'add-player'(){
    const name=$('#p-new').value.trim();if(!name)return setMsg('p-msg','名前を入れてください','err');
    if(data.players.some(p=>p.name===name))return setMsg('p-msg','同じ名前のメンバーがいます','err');
    const id='p'+uid();save(d=>{d.players.push({id,name,created:Date.now()});},{done:name+' を追加しました'});
  },
  'del-player'(b){
    const id=b.dataset.pid;const key='p:'+id;if(confirmKey!==key){confirmKey=key;render();return;}
    confirmKey=null;save(d=>{d.players=d.players.filter(p=>p.id!==id);},{done:'メンバーを削除しました'});
  },
  'save-defaults'(){
    const a=readRule('d4',4);if(a.err)return setMsg('d-msg','四麻：'+a.err,'err');
    const c=readRule('d3',3);if(c.err)return setMsg('d-msg','三麻：'+c.err,'err');
    save(d=>{d.defaults={"3":c.rule,"4":a.rule};},{done:'標準ルールを保存しました'});
  },
  'login-open'(){loginOpen=true;render();const el=$('#pw');if(el)el.focus();},
  login(){
    const pw=$('#pw').value;if(!pw)return setMsg('pw-msg','合言葉を入れてください','err');
    setMsg('pw-msg','確認中…','');
    signInWithEmailAndPassword(auth,GROUP_EMAIL,pw).then(()=>{loginOpen=false;toast('記録できるようになりました');},e=>{
      const c=e&&e.code||'';setMsg('pw-msg',/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?'合言葉が違います':c==='auth/too-many-requests'?'失敗が続いたので、少し待ってからもう一度試してください':'ログインできませんでした（'+c+'）','err');});
  },
  logout(){signOut(auth).then(()=>toast('見るだけモードに戻しました'));},
  'imp-check'(){
    const txt=$('#imp-text').value.trim();if(!txt)return setMsg('imp-msg','データを貼り付けてください','err');
    let d;try{d=JSON.parse(txt);}catch(e){return setMsg('imp-msg','JSONとして読めませんでした。全部コピーできているか確認してください','err');}
    const players=Array.isArray(d.players)?d.players:[],sessions=Array.isArray(d.sessions)?d.sessions:[];
    if(!players.length&&!sessions.length&&!d.defaults)return setMsg('imp-msg','取り込める記録が見つかりませんでした','err');
    for(const p of players)if(!p||!p.id||!p.name)return setMsg('imp-msg','メンバーのデータにidかnameがありません','err');
    for(const s of sessions){if(!s||!s.id||!/^\d{4}-\d{2}-\d{2}$/.test(s.date||'')||![3,4].includes(s.mode)||!Array.isArray(s.members)||!Array.isArray(s.games))return setMsg('imp-msg','対局日のデータの形が正しくありません（'+esc(String(s&&s.id))+'）','err');
      for(const g of s.games)if(!g||!g.id||!(g.pts||g.scores))return setMsg('imp-msg',s.date+' の半荘データの形が正しくありません','err');}
    const known=new Set(data.players.map(p=>p.id).concat(players.map(p=>p.id)));
    const missing=new Set();sessions.forEach(s=>s.members.forEach(id=>{if(!known.has(id))missing.add(id);}));
    if(missing.size)return setMsg('imp-msg','メンバー一覧にいない人のIDが含まれています','err');
    const over=sessions.filter(s=>data.sessions.some(x=>x.id===s.id)).length;
    const games=sessions.reduce((a,s)=>a+s.games.reduce((b,g)=>b+(g.summary?(g.count||1):1),0),0);
    importDraft={d:{players,sessions,defaults:d.defaults||null},summary:'メンバー'+players.length+'人・対局日'+sessions.length+'日（半荘'+games+'回）を取り込みます'+(over?'。うち'+over+'日は今ある記録を上書きします':'')+'。'};
    render();const ta=$('#imp-text');if(ta)ta.value=txt;
  },
  'imp-cancel'(){importDraft=null;render();},
  'imp-run'(){
    const src=importDraft&&importDraft.d;if(!src)return;
    save(d=>{
      src.players.forEach((p,i)=>{const ex=d.players.find(x=>x.id===p.id);if(ex)ex.name=p.name;else d.players.push({id:p.id,name:p.name,created:typeof p.created==='number'?p.created:Date.now()+i});});
      src.sessions.forEach(s=>{const n=clone(s);n.rule=normRule(n.rule,n.mode);n.chips=n.chips||{};n.memo=n.memo||'';if(typeof n.created!=='number')n.created=Date.now();
        n.games=n.games.map((g,i)=>{const x=clone(g);if(typeof x.seq!=='number')x.seq=i;return x;});
        const i=d.sessions.findIndex(x=>x.id===n.id);if(i>=0)d.sessions[i]=n;else d.sessions.push(n);});
      if(src.defaults)d.defaults={"3":normRule(src.defaults[3],3),"4":normRule(src.defaults[4],4)};
    },{done:'記録を取り込みました',before(){importDraft=null;}});
  },
  'dl-json'(){
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='mahjong-'+todayStr()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  },
  'copy-json'(){
    const txt=JSON.stringify(data,null,1);
    const fallback=()=>{const box=$('#json-box');box.innerHTML='<textarea class="in" id="json-text" readonly aria-label="記録データ"></textarea>';const ta=$('#json-text');ta.value=txt;ta.focus();ta.select();toast('コピーできなかったので、表示したテキストを手動でコピーしてください');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('記録データをコピーしました'),fallback);}catch(e){fallback();}
  }
};
function markStart(t){if(gSeen||gEditId||!t||!t.closest||!t.closest('#addgame'))return;const s=cur();if(s)gSeen=new Set(s.games.map(g=>g.id));}
function refreshUma0(p){
  const el=document.getElementById(p+'-uma0');if(!el)return;
  const mode=document.getElementById(p+'-uma-3')?4:3;
  const start=parseIntLoose($('#'+p+'-start').value),ret=parseIntLoose($('#'+p+'-ret').value);
  let s=0,ok=isFinite(start)&&isFinite(ret);
  for(let i=1;i<mode;i++){const v=parseNum($('#'+p+'-uma-'+i).value);if(!isFinite(v))ok=false;else s+=v;}
  el.textContent=ok?fmtPt(r1((ret-start)*mode/1000-s)):'—';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const name=b.dataset.act;if(!act[name])return;
  if(busy&&!['tab','open','back','tmode','tsort','rate','copy-json','dl-json','login-open','login','logout'].includes(name))return;
  if(!/^del-/.test(name))confirmKey=null;
  act[name](b);
});
document.addEventListener('input',e=>{
  const t=e.target;
  markStart(t);
  if(t.classList.contains('g-in'))updateGameSum();
  else if(t.classList.contains('chip-in'))updateChipSum();
  else if(t.classList.contains('yk-name')){const c=ykParts[Number(t.dataset.i)];if(c){c.name=t.value.trim();if(c.auto){c.mult=multOf(c.name);const s=document.getElementById('yk-mult-'+t.dataset.i);if(s)s.value=String(c.mult);ykSumText();}}}
  else{const m=/^(n|e|d4|d3)-(start|ret|uma-\d)$/.exec(t.id);if(m)refreshUma0(m[1]);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  markStart(t);
  if(t.id==='t-year'){ui.tYear=t.value;persistUi();render();}
  else if(t.id==='t-min'){ui.tMin=Number(t.value)||0;persistUi();render();}
  else if(t.classList.contains('g-sel'))updateGameSum();
  else if(t.classList.contains('tb-pid')){gTobi[Number(t.dataset.i)].pid=t.value;}
  else if(t.classList.contains('tb-by')){gTobi[Number(t.dataset.i)].by=t.value;updateGameSum();}
  else if(t.classList.contains('yk-mult')){const c=ykParts[Number(t.dataset.i)];if(c){c.mult=Number(t.value)||1;c.auto=false;ykSumText();}}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  const t=e.target;
  if(t.classList&&t.classList.contains('g-in')){e.preventDefault();act['add-game']();}
  else if(t.id==='n-newname'||t.id==='e-newname'){e.preventDefault();act.maddname({dataset:{prefix:t.id.slice(0,1)}});}
  else if(t.id==='p-new'){e.preventDefault();act['add-player']();}
  else if(t.id==='pw'){e.preventDefault();act.login();}
});

/* ---------- start ---------- */
let db=null,auth=null;
function refresh(){if(loadedParts.size>=4){const prev=loaded?data:null;loaded=true;data=compose();if(prev)checkSeat(prev,data);render({keep:true});}}
function checkSeat(prev,next){
  next.sessions.forEach(s=>{const o=prev.sessions.find(x=>x.id===s.id);const due=seatDue(s);if(due&&(!o||totalGames(o)<due))showSeat(due);});
}
function listenErr(e){loadError=(e&&e.code==='permission-denied')?'データベースの読み取りが許可されていません。Firestoreのルールを確認してください。':'接続できませんでした（'+(e&&e.code||'error')+'）。電波の良いところで開き直してください。';render();}
if(CONFIGURED){
  const fb=initializeApp(FIREBASE_CONFIG);
  db=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true});
  auth=getAuth(fb);
  onAuthStateChanged(auth,u=>{authUser=u;canWrite=!!u&&(!GROUP_UID||GROUP_UID.startsWith('__')||u.uid===GROUP_UID);render({keep:true});});
  onSnapshot(collection(db,'players'),snap=>{raw.players=new Map(snap.docs.map(x=>[x.id,x.data()]));loadedParts.add('p');refresh();},listenErr);
  onSnapshot(collection(db,'sessions'),snap=>{raw.sessions=new Map(snap.docs.map(x=>[x.id,x.data()]));loadedParts.add('s');refresh();},listenErr);
  onSnapshot(collection(db,'games'),snap=>{raw.games=new Map(snap.docs.map(x=>[x.id,x.data()]));loadedParts.add('g');refresh();},listenErr);
  onSnapshot(doc(db,'config','defaults'),snap=>{raw.defaults=snap.exists()?snap.data():null;loadedParts.add('d');refresh();},listenErr);
}
render();
function showSeat(n){
  document.querySelectorAll('.seat-ov').forEach(e=>e.remove());
  const ov=document.createElement('div');ov.className='seat-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-labelledby','seat-t');
  ov.innerHTML='<div class="seat-card"><span class="stick big" aria-hidden="true"><i></i></span><p class="seat-t" id="seat-t">席替えです</p><p class="hint">'+n+'半荘が終わりました</p><button type="button" class="btn primary" id="seat-ok">OK</button></div>';
  document.body.appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();};
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.id==='seat-ok')close();});
  document.addEventListener('keydown',onKey);
  const b=ov.querySelector('#seat-ok');if(b)b.focus();
}
</script>
